name: Auto-Request Google Indexing

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  index-urls:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Google Indexing Script
        env:
          GCP_INDEXING_KEY: ${{ secrets.GCP_INDEXING_KEY }}
        run: node scripts/index-urls.js

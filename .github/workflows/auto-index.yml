name: Auto-Request Google & IndexNow Indexing

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  index-urls:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Google APIs
        run: npm install googleapis

      - name: Run Google Indexing Script
        env:
          GCP_INDEXING_KEY: ${{ secrets.GCP_INDEXING_KEY }}
        run: node scripts/index-urls.js

      - name: Run IndexNow Script (Bing & Multi-Engine)
        run: node scripts/indexnow.js
